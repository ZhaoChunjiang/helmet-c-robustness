name: Legacy pre-V3.1 Table-2 Verification

on:
  workflow_dispatch:

jobs:
  verify-legacy-table2:
    name: Verify legacy pre-V3.1 Table 2
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Recompute legacy three-seed summary
        run: python scripts/summarize_three_seed.py
      - name: Verify legacy manuscript Table 2
        run: python scripts/verify_table2.py
      - name: Notice
        run: echo "Legacy verification only; current manuscript headline metrics are V3.1 under results/V3.1_final_4x3/."
